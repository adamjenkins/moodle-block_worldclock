name: block_worldclock
summary: 'A Moodle block that displays the current time in multiple timezones, on course pages, activities, and the dashboard.'
description: |
  Shows live-updating clocks for any hand-picked set of IANA timezones — or,
  in automatic mode, for every distinct timezone used by the users enrolled in
  a course. Clocks handle daylight saving correctly, and per-instance options
  cover 12/24-hour format, seconds, and showing the date only when it differs
  from the viewer's own.
labels:
  # Required disclosure labels — pick all that apply (RFC §4.7):
  #   fully-free | freemium | paid-service | external-account
  #   donation-supported | commercial-support-available
  - fully-free
screenshots:
  - path: .camp/screenshots/01-colour-on.png
    caption: Live clocks for each timezone, each row tinted by the local time of day
  - path: .camp/screenshots/02-colour-off.png
    caption: 'The same block with the colour background off: UTC offset, local date and a sun/moon waking-hours icon'
  - path: .camp/screenshots/03-course-page.png
    caption: The block on a course page
  - path: .camp/screenshots/04-settings.png
    caption: 'Block settings: timezones, sort order, UTC offset, 24-hour time, seconds, date, day/night icon and colour by time of day'
