name: block_worldclock
summary: 'A Moodle block that displays the current time in multiple timezones, on course pages, activities, and the dashboard.'
description: |
  Shows live-updating clocks for any hand-picked set of IANA timezones — or,
  in automatic mode, for every distinct timezone used by the users enrolled in
  a course. Clocks handle daylight saving correctly, and per-instance options
  cover 12/24-hour format, seconds, and showing the date only when it differs
  from the viewer's own.
